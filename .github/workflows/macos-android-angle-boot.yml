# SPDX-License-Identifier: MIT
name: Android boot test on the ANGLE path (macOS host)
on:
  workflow_dispatch:
    inputs:
      angle_run:
        description: Run id of the ANGLE build that holds the angle-metal artifact
        required: true
      profiles:
        description: "all, first, jit, or tier"
        default: "all"
      tiers:
        description: "tier thresholds in instructions, space separated"
        default: "200000000 2000000000"
permissions:
  contents: read
  actions: read
concurrency:
  group: andarium-angle-boot-${{ inputs.profiles }}
  cancel-in-progress: true
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build the debuggable probe application
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
          bash ci/ios18/probe-app/build.sh "$RUNNER_TEMP/probe"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-app
          path: ${{ runner.temp }}/probe
          retention-days: 30
  boot:
    if: github.event.repository.private == false
    needs: probe
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - name: Fetch public sources
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
          git init upstream
          git -C upstream remote add origin https://github.com/imxieyi/Kernarium.git
          git -C upstream fetch --depth=1 origin ce0fa8683a5103175dfb62d58cdb5b27a6ecd5a9
          git -C upstream checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@v4
        with:
          name: angle-metal
          run-id: ${{ inputs.angle_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/angle-download
      - uses: actions/download-artifact@v4
        with:
          name: probe-app
          path: ${{ runner.temp }}/probe
      - name: Install isolated build-only Python tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --target "$RUNNER_TEMP/python-tools" \
            meson==1.12.1 Mako==1.4.3 packaging==26.3 PyYAML==6.0.3 ply==3.11
          echo "PYTHONPATH=$RUNNER_TEMP/python-tools" >> "$GITHUB_ENV"
      - name: Build and boot
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/angle-download/angle-package.tar.gz"
          export PROFILES="${{ inputs.profiles }}"
          export TIERS="${{ inputs.tiers }}"
          bash ci/ios18/boot-android-macos-angle.sh upstream "$RUNNER_TEMP" "$RUNNER_TEMP/angle-package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angle-boot-report
          path: ${{ runner.temp }}/boot-report
          retention-days: 30
