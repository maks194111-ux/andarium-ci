# SPDX-License-Identifier: MIT
name: iOS 18 graphics bridge build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: andarium-zink-build
  cancel-in-progress: true
jobs:
  bridge:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Fetch public sources and checked driver archive
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
          git init upstream
          git -C upstream remote add origin https://github.com/imxieyi/Kernarium.git
          git -C upstream fetch --depth=1 origin ce0fa8683a5103175dfb62d58cdb5b27a6ecd5a9
          git -C upstream checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/graphics"
          curl -fL --max-time 120 \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar \
            -o "$RUNNER_TEMP/graphics/MoltenVK.tar"
          echo "f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e  $RUNNER_TEMP/graphics/MoltenVK.tar" | shasum -a 256 -c -
          tar xf "$RUNNER_TEMP/graphics/MoltenVK.tar" -C "$RUNNER_TEMP/graphics"
      - name: Install isolated build-only Python tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --target "$RUNNER_TEMP/python-tools" \
            meson==1.12.1 Mako==1.4.3 packaging==26.3 PyYAML==6.0.3 ply==3.11
          echo "PYTHONPATH=$RUNNER_TEMP/python-tools" >> "$GITHUB_ENV"
          command -v ninja
          command -v pkg-config
      - name: Build actual patched Mesa Zink against MoltenVK
        shell: bash
        run: |
          set -euo pipefail
          bash ci/ios18/build-zink-moltenvk.sh upstream "$RUNNER_TEMP/graphics"
          {
            echo "Patched Mesa Zink compiled against MoltenVK."
            echo "OpenGL 4.6 context and framebuffer readback passed."
            echo "Experimental host bridge, not a production prefix or iOS IPA."
          } >> "$GITHUB_STEP_SUMMARY"
