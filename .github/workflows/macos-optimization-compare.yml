# SPDX-License-Identifier: MIT
name: Android optimization comparison (reuse probe)
on:
  workflow_dispatch:
    inputs:
      angle_run:
        description: Existing ANGLE build
        required: true
      probe_run:
        description: Existing successful probe-app build with unchanged probe sources
        required: true
      profiles:
        description: Comparison profile
        default: mapping
      tiers:
        description: Interpreter/JIT thresholds for existing optional profiles
        default: "200000000 2000000000"
      upstream_ref:
        description: Engine source commit
        default: ce0fa8683a5103175dfb62d58cdb5b27a6ecd5a9
      aot_image:
        description: Image for the ahead-of-time profile (google or stock)
        default: google
      baseline_system_sha256:
        description: FIX9 system disk hash required for the AOT comparison
permissions:
  contents: read
  actions: read
concurrency:
  group: andarium-optimization-compare-${{ inputs.profiles }}-${{ inputs.aot_image }}
  cancel-in-progress: true
jobs:
  boot:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Fetch public sources
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
          git init upstream
          git -C upstream remote add origin https://github.com/imxieyi/Kernarium.git
          git -C upstream fetch --depth=1 origin "${{ inputs.upstream_ref }}"
          git -C upstream checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@v4
        with:
          name: angle-metal
          run-id: ${{ inputs.angle_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/angle-download
      - uses: actions/download-artifact@v4
        with:
          name: probe-app
          run-id: ${{ inputs.probe_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/probe
      - name: Install isolated build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --target "$RUNNER_TEMP/python-tools" \
            meson==1.12.1 Mako==1.4.3 packaging==26.3 PyYAML==6.0.3 ply==3.11
          echo "PYTHONPATH=$RUNNER_TEMP/python-tools" >> "$GITHUB_ENV"
      - name: Build and compare
        shell: bash
        env:
          GAPPS_IPA_URL: ${{ secrets.GAPPS_IPA_URL }}
          GAPPS_AOT_RELEASE_URL: ${{ secrets.GAPPS_AOT_RELEASE_URL }}
          GAPPS_ALLSPEED_RELEASE_URL: ${{ secrets.GAPPS_ALLSPEED_RELEASE_URL }}
          GAPPS_FIX9_IPA_URL: ${{ secrets.GAPPS_FIX9_IPA_URL }}
          EXPECTED_BASELINE_SYSTEM_SHA256: ${{ inputs.baseline_system_sha256 }}
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/angle-download/angle-package.tar.gz"
          export PROFILES="${{ inputs.profiles }}"
          export TIERS="${{ inputs.tiers }}"
          export AOT_IMAGE="${{ inputs.aot_image }}"
          bash ci/ios18/boot-android-macos-angle.sh upstream "$RUNNER_TEMP" "$RUNNER_TEMP/angle-package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angle-boot-report
          path: ${{ runner.temp }}/boot-report
          retention-days: 30
