# SPDX-License-Identifier: MIT
name: iOS 18 Virgl on ANGLE Metal
on:
  workflow_dispatch:
    inputs:
      angle_run:
        description: Run id of the ANGLE build that holds the angle-metal artifact
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: andarium-virgl-angle
  cancel-in-progress: true
jobs:
  bridge:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Fetch public sources
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
          git init upstream
          git -C upstream remote add origin https://github.com/imxieyi/Kernarium.git
          git -C upstream fetch --depth=1 origin ce0fa8683a5103175dfb62d58cdb5b27a6ecd5a9
          git -C upstream checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/graphics"
      - uses: actions/download-artifact@v4
        with:
          name: angle-metal
          run-id: ${{ inputs.angle_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/angle-download
      - name: Install isolated build-only Python tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --target "$RUNNER_TEMP/python-tools" \
            meson==1.12.1 Mako==1.4.3 packaging==26.3 PyYAML==6.0.3 ply==3.11
          echo "PYTHONPATH=$RUNNER_TEMP/python-tools" >> "$GITHUB_ENV"
      - name: Build patched virglrenderer on ANGLE and render through it
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/angle-download/angle-package.tar.gz"
          bash ci/ios18/build-virgl-angle.sh upstream "$RUNNER_TEMP/graphics" "$RUNNER_TEMP/angle-package"
          {
            echo "Andarium's patched virglrenderer initialised on ANGLE Metal and rendered a frame."
            echo "Host-side macOS test. No Android guest, no Vulkan for the guest, not an IPA."
          } >> "$GITHUB_STEP_SUMMARY"
