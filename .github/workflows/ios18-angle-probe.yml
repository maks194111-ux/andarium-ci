# SPDX-License-Identifier: MIT
name: iOS 18 ANGLE Metal capability probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Fetch probe and a prebuilt ANGLE (Chromium snapshot)
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
          base=https://storage.googleapis.com/chromium-browser-snapshots/Mac_Arm
          revision=$(curl -fsL --max-time 60 "$base/LAST_CHANGE")
          echo "Chromium snapshot revision $revision"
          curl -fL --max-time 600 "$base/$revision/chrome-mac.zip" -o "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chrome"
          find "$RUNNER_TEMP/chrome" -name 'libEGL.dylib' -o -name 'libGLESv2.dylib'
      - name: Query ANGLE on Metal
        shell: bash
        run: |
          set -euo pipefail
          lib=$(dirname "$(find "$RUNNER_TEMP/chrome" -name libGLESv2.dylib | head -1)")
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror ci/ios18/angle-probe.cpp -o "$RUNNER_TEMP/angle-probe"
          python3 - "$RUNNER_TEMP/angle-probe" "$lib" <<'PY'
          import subprocess, sys
          subprocess.run(sys.argv[1:], check=True, timeout=90)
          PY
