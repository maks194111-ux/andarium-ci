# SPDX-License-Identifier: MIT
name: iOS 18 ANGLE Metal capability probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Fetch probe
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
      - name: Query ANGLE on Metal
        shell: bash
        run: |
          set -euo pipefail
          # Lives in the dyld shared cache; the same backend serves WebGL on iOS.
          lib=/System/Library/PrivateFrameworks/WebCore.framework/Frameworks/libANGLE-shared.dylib
          sw_vers
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror ci/ios18/angle-probe.cpp -o "$RUNNER_TEMP/angle-probe"
          python3 - "$RUNNER_TEMP/angle-probe" "$lib" <<'PY'
          import subprocess, sys
          subprocess.run(sys.argv[1:], check=True, timeout=90)
          PY
