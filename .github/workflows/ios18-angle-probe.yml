# SPDX-License-Identifier: MIT
name: iOS 18 ANGLE Metal capability probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Fetch probe
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
      - name: Query ANGLE on Metal
        shell: bash
        run: |
          set -euo pipefail
          # Lives in the dyld shared cache; the same backend serves WebGL on iOS.
          w=Frameworks/WebKit.framework/Versions/A/Frameworks/WebCore.framework/Versions/A/Frameworks/libANGLE-shared.dylib
          lib="/System/Library/$w /System/Cryptexes/OS/System/Library/$w /System/Volumes/Preboot/Cryptexes/OS/System/Library/$w /System/Library/PrivateFrameworks/WebCore.framework/Versions/A/Frameworks/libANGLE-shared.dylib"
          sw_vers
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror ci/ios18/angle-probe.cpp -o "$RUNNER_TEMP/angle-probe"
          python3 - "$RUNNER_TEMP/angle-probe" "$lib" <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.argv[1], *sys.argv[2].split()], timeout=90)
          print("probe exit status", result.returncode, flush=True)
          sys.exit(result.returncode != 0)
          PY
