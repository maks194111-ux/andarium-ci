# SPDX-License-Identifier: MIT
name: Simulator probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: What the runner has
        shell: bash
        run: |
          set +e
          sw_vers; uname -m; sysctl -n hw.ncpu hw.memsize
          ls /Applications | grep -i xcode
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -iE 'iPhone (11|SE)'
          df -h / | tail -1
