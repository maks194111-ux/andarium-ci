# SPDX-License-Identifier: MIT
name: Simulator probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Fetch public sources
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
      - name: Which older iOS Simulator runtimes Apple offers this Xcode
        shell: bash
        run: |
          set +e
          which xcodes && xcodes runtimes 2>&1 | head -60
          for v in 18.0 18.1 18.2 18.3 18.3.1 18.4 18.5 18.6 22A3351 22B81 22C150 22D8075 22E238 22F77 22G86 26.0 26.1 26.2 26.4; do
            echo "== $v"
            xcodebuild -downloadPlatform iOS -buildVersion "$v" 2>&1 | tail -3
            if xcrun simctl list runtimes | grep -qE "iOS (18|26)\."; then break; fi
          done
          xcrun simctl list runtimes
          df -h / | tail -1
