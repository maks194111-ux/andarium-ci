# SPDX-License-Identifier: MIT
name: Simulator probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Fetch public sources
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
      - name: iPhone 11 on iOS 18 in the Simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(bash ci/ios18/simulator-ios18.sh | tail -1)
          xcrun simctl list devices | grep -i andarium
          xcrun simctl getenv "$UDID" SIMULATOR_RUNTIME_VERSION
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/home.png"
          xcrun simctl spawn "$UDID" sysctl -n hw.memsize hw.ncpu || true
          ls -la "$RUNNER_TEMP/home.png"
