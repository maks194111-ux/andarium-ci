name: Record the actual iPad Simulator display
run-name: Native iPad video, app ${{ inputs.app_run }}
on:
  workflow_dispatch:
    inputs:
      app_run:
        description: App build to record
        required: true
      angle_sim_run:
        description: Compatible ANGLE Simulator build
        required: true
permissions:
  contents: read
  actions: read
jobs:
  recording:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Fetch the recording harness
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@v4
        with:
          name: andarium-ios18-app-without-system-image
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/app-download
      - uses: actions/download-artifact@v4
        with:
          name: angle-metal-simulator
          run-id: ${{ inputs.angle_sim_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/angle-sim-download
      - name: Capture native video with real touch input
        env:
          IMAGE_KIND: gapps
          GAPPS_IPA_URL: ${{ secrets.GAPPS_FIX9_IPA_URL }}
          SOAK_SECONDS: "180"
          STARTUP_RECORD_SECONDS: "120"
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/angle-sim-download/angle-sim.tar.gz"
          bash ci/ios18/run-simulator.sh \
            "$RUNNER_TEMP/app-download/Andarium-ios18-no-image.zip" \
            "$RUNNER_TEMP" 1200 "$RUNNER_TEMP/angle-sim" 3072 iPad-Pro-auto 27
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-native-recording
          path: ${{ runner.temp }}/simulator-report
          retention-days: 14
