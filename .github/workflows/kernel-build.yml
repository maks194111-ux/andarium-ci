# SPDX-License-Identifier: MIT
name: Guest kernel build (engine source's own scripts)
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Engine source commit
        required: true
      release_id:
        description: Kernel release identifier the commit accepts
        required: true
permissions:
  contents: read
jobs:
  kernel:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - name: Build and publish the Android guest kernel
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/imxieyi/Kernarium.git
          git -C upstream fetch --depth=1 origin "${{ inputs.upstream_ref }}"
          git -C upstream checkout --detach FETCH_HEAD
          git config --global user.name kernarium; git config --global user.email kernarium@users.noreply.github.com
          for tool in meson make llvm lld autoconf automake libtool pkg-config cmake ninja gawk gnu-sed xz zstd; do
            HOMEBREW_NO_AUTO_UPDATE=1 brew list "$tool" >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install "$tool" >/dev/null
          done
          BREW=$(brew --prefix)
          export PATH="$BREW/opt/llvm/bin:$BREW/opt/lld/bin:$BREW/opt/make/libexec/gnubin:$PATH"
          clang --version | head -1; ld.lld --version; gmake --version | head -1
          hdiutil create -size 30g -fs "Case-sensitive APFS" -volname kbuild "$RUNNER_TEMP/kbuild.sparseimage" -type SPARSE >/dev/null
          hdiutil attach "$RUNNER_TEMP/kbuild.sparseimage" >/dev/null
          cd upstream
          echo "UML_KERNEL_SOURCE_DIR=/Volumes/kbuild/linux" > kernel/mainline-6.18/source-location.conf
          echo "===== STAGE: host tools (pahole, libelf)"
          sed -i '' -e 's|https://git.savannah.gnu.org/git/gnulib.git|https://github.com/coreutils/gnulib.git|' \
            -e 's|https://git.savannah.gnu.org/git/libiconv.git|https://github.com/arthenica/libiconv.git|' dependencies/manifest.tsv
          # The GNU server answers 502 at times; the sources are pinned by commit.
          for attempt in 1 2 3 4 5 6; do
            bash dependencies/prepare.sh --product kernel-host-tools && break
            [ "$attempt" = 6 ] && exit 1; sleep 45
          done
          bash dependencies/prepare.sh --archive-manifest dependencies/kernel-host-tools/archives.tsv
          UML_KERNEL_HOST_TOOLS_JOBS=4 bash dependencies/build-kernel-host-tools.sh
          echo "===== STAGE: kernel source"
          kernel/mainline-6.18/scripts/prepare-source.sh
          echo "===== STAGE: kernel build"
          kernel/mainline-6.18/build/build-kernel.sh --product android --build /Volumes/kbuild/build-android --jobs 4
          echo "===== STAGE: publish"
          mkdir -p "$RUNNER_TEMP/out"
          python3 kernel/mainline-6.18/build/publish-artifact.py --source /Volumes/kbuild/linux --build /Volumes/kbuild/build-android \
            --product android --output-root "$RUNNER_TEMP/out" --release-id "${{ inputs.release_id }}" --objcopy "$(command -v llvm-objcopy)"
          ls -la "$RUNNER_TEMP/out"/*
          cat "$RUNNER_TEMP/out"/*/kernel-artifact.json | head -40
          tar -C "$RUNNER_TEMP/out" -czf "$RUNNER_TEMP/kernel.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: guest-kernel
          path: ${{ runner.temp }}/kernel.tar.gz
          retention-days: 30
