# SPDX-License-Identifier: MIT
name: iOS 18 ANGLE Metal build (Simulator slice)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: andarium-angle-sim-build
  cancel-in-progress: true
jobs:
  angle:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      ANGLE_COMMIT: 47d8f0e238b79b3031a8f431648bf94d1459c03f
      DEPOT_TOOLS_COMMIT: ec77017fb3e090ff02bffb9c6980ebcdd3006ddc
      DEPOT_TOOLS_UPDATE: "0"
    steps:
      - name: Fetch probe, build tools and pinned ANGLE sources
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
          git init depot_tools
          git -C depot_tools fetch --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools "$DEPOT_TOOLS_COMMIT"
          git -C depot_tools checkout --detach FETCH_HEAD
          export PATH="$PWD/depot_tools:$PATH"
          mkdir angle-root && cd angle-root
          cat > .gclient <<GCLIENT
          solutions = [{
            "name": "angle",
            "url": "https://chromium.googlesource.com/angle/angle.git@$ANGLE_COMMIT",
            "deps_file": "DEPS",
            "managed": False,
            "custom_vars": {"checkout_angle_internal": False, "checkout_angle_mesa": False},
          }]
          target_os = ["mac", "ios"]
          GCLIENT
          sed -i '' 's/^          //' .gclient
          gclient sync --no-history --shallow --nohooks -j 6
          gclient runhooks
          python3 ../ci/ios18/angle_ubo_patch.py angle
          python3 ../ci/ios18/angle_sim_patch.py angle
          du -sh angle
      - name: Build ANGLE for the iOS 18 Simulator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/depot_tools:$PATH"
          cd angle-root/angle
          # Call the pinned tools the sources ship; the depot_tools wrappers want a self-update.
          GN=$(find "$PWD/buildtools/mac" -type f -name gn | head -1)
          NINJA=$(find "$PWD/third_party/ninja" -maxdepth 1 -type f -name ninja | head -1)
          [ -x "$GN" ] && [ -x "$NINJA" ]
          common='is_debug=false is_component_build=false symbol_level=0 angle_build_tests=false angle_enable_metal=true angle_enable_gl=false angle_enable_vulkan=false angle_enable_swiftshader=false angle_enable_null=false angle_enable_wgpu=false angle_enable_cl=false target_cpu="arm64"'
          "$GN" gen out/iossim --args="$common target_os=\"ios\" target_environment=\"simulator\" ios_deployment_target=\"18.0\" ios_enable_code_signing=false"
          "$NINJA" -j 4 -C out/iossim libEGL libGLESv2
          find out/iossim -maxdepth 2 \( -name 'libGLESv2*' -o -name 'libEGL*' \) -print
          binary=$(find out/iossim -maxdepth 2 -type f -name libGLESv2 | head -1)
          [ -n "$binary" ] || binary=$(find out/iossim -maxdepth 1 -type f -name 'libGLESv2*' | head -1)
          xcrun vtool -show-build "$binary"
          lipo -info "$binary"
      - name: Package the Simulator frameworks
        shell: bash
        run: |
          set -euo pipefail
          cd angle-root/angle
          mkdir -p "$RUNNER_TEMP/angle-sim/iossim"
          cp -R out/iossim/libEGL.framework out/iossim/libGLESv2.framework "$RUNNER_TEMP/angle-sim/iossim/"
          echo "$ANGLE_COMMIT" > "$RUNNER_TEMP/angle-sim/COMMIT"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/angle-sim.tar.gz" angle-sim
      - uses: actions/upload-artifact@v4
        with:
          name: angle-metal-simulator
          path: ${{ runner.temp }}/angle-sim.tar.gz
          retention-days: 30
