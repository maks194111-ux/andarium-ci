name: Andarium Google image simulator compatibility
run-name: Google image iPadOS 27 and iOS 18 phones, app ${{ inputs.app_run }}
on:
  workflow_dispatch:
    inputs:
      app_run:
        description: Corrected device app build
        required: true
      angle_sim_run:
        description: ANGLE simulator build
        required: true
        default: "43700644337"
      metal_validation:
        description: Enable the app-side Metal validation layer (1) or not (0)
        required: false
        default: "0"
      soak_seconds:
        description: After Android is ready, fling its language list this long (0 = no soak)
        required: false
        default: "0"
permissions:
  contents: read
  actions: read
jobs:
  simulator:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - { device: iPhone-11, ios: "18", runner: macos-15, memory: "1408" }
          - { device: iPhone-12, ios: "18", runner: macos-15, memory: "1408" }
          - { device: iPhone-13, ios: "18", runner: macos-15, memory: "1408" }
          - { device: iPhone-14, ios: "18", runner: macos-15, memory: "2048" }
          - { device: iPhone-15, ios: "18", runner: macos-15, memory: "2048" }
          - { device: iPhone-16-Pro, ios: "18", runner: macos-15, memory: "3072" }
          - { device: iPad-Pro-auto, ios: "27", runner: xcode-27, memory: "3072" }
          - { device: iPad-Pro-auto, ios: "18", runner: macos-15, memory: "3072" }
    name: ${{ matrix.device }} iOS ${{ matrix.ios }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    steps:
      - name: Fetch public test sources
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@v4
        with:
          name: andarium-ios18-app-without-system-image
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/app-download
      - uses: actions/download-artifact@v4
        with:
          name: angle-metal-simulator
          run-id: ${{ inputs.angle_sim_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/angle-sim-download
      - name: Start the simulator check
        shell: bash
        env:
          IMAGE_KIND: gapps
          METAL_VALIDATION: ${{ inputs.metal_validation }}
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
          GAPPS_IPA_URL: ${{ secrets.GAPPS_IPA_URL }}
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/angle-sim-download/angle-sim.tar.gz"
          (
            set +e
            bash ci/ios18/run-simulator.sh \
              "$RUNNER_TEMP/app-download/Andarium-ios18-no-image.zip" \
              "$RUNNER_TEMP" "$([ "$SOAK_SECONDS" -gt 0 ] && echo 1200 || echo 420)" "$RUNNER_TEMP/angle-sim" \
              "${{ matrix.memory }}" "${{ matrix.device }}" "${{ matrix.ios }}"
            result=$?
            printf '%s\n' "$result" > "$RUNNER_TEMP/simulator.exit.tmp"
            mv "$RUNNER_TEMP/simulator.exit.tmp" "$RUNNER_TEMP/simulator.exit"
          ) > "$RUNNER_TEMP/simulator-live.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/simulator.pid"
      - name: Wait for the home screenshot
        run: python3 ci/ios18/wait_simulator_progress.py "$RUNNER_TEMP" "01-home.png"
      - uses: actions/upload-artifact@v4
        with:
          name: progress-home-${{ matrix.device }}-ios${{ matrix.ios }}
          path: ${{ runner.temp }}/simulator-report/01-home.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Wait for the early Android screenshot
        run: python3 ci/ios18/wait_simulator_progress.py "$RUNNER_TEMP" "03-start-*.png"
      - uses: actions/upload-artifact@v4
        with:
          name: progress-early-${{ matrix.device }}-ios${{ matrix.ios }}
          path: ${{ runner.temp }}/simulator-report/03-start-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Wait for the next Android screenshot
        run: python3 ci/ios18/wait_simulator_progress.py "$RUNNER_TEMP" "06-start-*.png"
      - uses: actions/upload-artifact@v4
        with:
          name: progress-boot-${{ matrix.device }}-ios${{ matrix.ios }}
          path: ${{ runner.temp }}/simulator-report/06-start-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect the final check result
        if: always()
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 720); do
            [ -f "$RUNNER_TEMP/simulator.exit" ] && break
            [ -f "$RUNNER_TEMP/simulator.pid" ] || break
            kill -0 "$(cat "$RUNNER_TEMP/simulator.pid")" 2>/dev/null || break
            sleep 5
          done
          cat "$RUNNER_TEMP/simulator-live.log"
          mkdir -p "$RUNNER_TEMP/simulator-report"
          cp "$RUNNER_TEMP/simulator-live.log" "$RUNNER_TEMP/simulator-report/harness.log"
          [ -f "$RUNNER_TEMP/simulator.exit" ] || exit 1
          exit "$(cat "$RUNNER_TEMP/simulator.exit")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-${{ matrix.device }}-ios${{ matrix.ios }}
          path: ${{ runner.temp }}/simulator-report
          retention-days: 14
