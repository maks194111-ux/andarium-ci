# SPDX-License-Identifier: MIT
name: iOS 18 Simulator run (iPhone 11)
run-name: Simulator ${{ inputs.device }} iOS ${{ inputs.ios }} ${{ inputs.memory_mib }}
on:
  workflow_dispatch:
    inputs:
      app_run:
        description: Run id of the app build that holds the app artifact
        required: true
      angle_sim_run:
        description: Run id of the ANGLE Simulator build
        required: true
      memory_mib:
        description: Guest RAM in MiB (empty for the app's own choice)
        default: ""
      device:
        description: Simulator device type
        default: "iPhone-11"
      ios:
        description: iOS major version of the Simulator runtime
        default: "18"
      runner:
        description: Runner label (macos-15 has iOS 18; xcode-27 has iOS 26 and later)
        default: "macos-15"
      seconds:
        description: How long to watch the Android start
        default: "420"
      recording:
        description: Record FIX9 Google image with real touch scrolling
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  simulator:
    if: github.event.repository.private == false
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - name: Fetch public sources
        shell: bash
        run: |
          set -euo pipefail
          git init ci
          git -C ci remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci fetch --depth=1 origin "$GITHUB_SHA"
          git -C ci checkout --detach FETCH_HEAD
      - uses: actions/download-artifact@v4
        with:
          name: andarium-ios18-app-without-system-image
          run-id: ${{ inputs.app_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/app-download
      - uses: actions/download-artifact@v4
        with:
          name: angle-metal-simulator
          run-id: ${{ inputs.angle_sim_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/angle-sim-download
      - name: Run on the iPhone 11 Simulator with iOS 18
        shell: bash
        env:
          IMAGE_KIND: ${{ inputs.recording && 'gapps' || 'stock' }}
          GAPPS_IPA_URL: ${{ secrets.GAPPS_FIX9_IPA_URL }}
          SOAK_SECONDS: ${{ inputs.recording && '180' || '0' }}
          STARTUP_RECORD_SECONDS: ${{ inputs.recording && '120' || '0' }}
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/angle-sim-download/angle-sim.tar.gz"
          bash ci/ios18/run-simulator.sh "$RUNNER_TEMP/app-download/Andarium-ios18-no-image.zip" "$RUNNER_TEMP" "${{ inputs.seconds }}" "$RUNNER_TEMP/angle-sim" "${{ inputs.memory_mib }}" "${{ inputs.device }}" "${{ inputs.ios }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-report-${{ inputs.device }}-ios${{ inputs.ios }}
          path: ${{ runner.temp }}/simulator-report
          retention-days: 14
